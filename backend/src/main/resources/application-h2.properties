# ===================================================================
# Standalone / Embedded Mode Configuration (H2 in MySQL compatibility mode)
# ===================================================================
server.port=8080
spring.application.name=asset-management-system

spring.datasource.url=jdbc:h2:mem:asset_management_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

logging.level.com.assetmanagement=INFO
logging.level.org.springframework.security=WARN
