# ===================================================================
# Test Configuration - In-Memory H2 Database with MySQL Mode
# ===================================================================
server.port=8089
spring.application.name=asset-management-system-test

spring.datasource.url=jdbc:h2:mem:asset_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=3600000

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
